<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Recetas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="impersonateBannerSlot"></div>

<div class="header">
  <div class="header-label" id="headerLabel">Alimentación saludable</div>
  <h1>Banco de Recetas</h1>
  <div class="header-meta" id="profilePills">
    <!-- llenado por JS -->
  </div>
  <div class="profile-edit" id="profileEdit">
    <div class="profile-grid">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="p_name">
      </div>
      <div class="form-group">
        <label>Edad</label>
        <input type="number" id="p_age" min="10" max="100">
      </div>
      <div class="form-group">
        <label>Peso (kg)</label>
        <input type="number" id="p_weight" step="0.1" min="30" max="250">
      </div>
      <div class="form-group">
        <label>Estatura (cm)</label>
        <input type="number" id="p_height" min="120" max="220">
      </div>
      <div class="form-group">
        <label>Sexo</label>
        <select id="p_sex">
          <option value="male">Hombre</option>
          <option value="female">Mujer</option>
        </select>
      </div>
      <div class="form-group">
        <label>Actividad</label>
        <select id="p_activity">
          <option value="sedentary">Sedentario</option>
          <option value="light">Ligero (1–3 d/sem)</option>
          <option value="moderate">Moderado (3–5 d/sem)</option>
          <option value="active">Activo (6–7 d/sem)</option>
        </select>
      </div>
    </div>
    <div class="profile-actions">
      <button class="btn-cancel" onclick="toggleProfileEdit()" style="color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.2)">Cancelar</button>
      <button class="btn-submit" onclick="saveProfile()">Guardar</button>
    </div>
  </div>
</div>

<div class="macro-bar">
  <div class="macro-item"><div class="val" id="mb-kcal">—</div><div class="lbl">kcal / día</div></div>
  <div class="macro-item"><div class="val" id="mb-prot">—</div><div class="lbl">Proteína</div></div>
  <div class="macro-item"><div class="val" id="mb-carbs">—</div><div class="lbl">Carbos</div></div>
  <div class="macro-item"><div class="val" id="mb-fat">—</div><div class="lbl">Grasas</div></div>
</div>

<div class="container">

  <!-- DESAYUNOS -->
  <div class="section" id="sec-desayunos">
    <div class="section-header">
      <div class="section-icon" style="background:#E3EDF9">🌅</div>
      <div class="section-title">Desayunos</div>
      <div class="section-count" id="count-desayunos"></div>
    </div>
    <div class="add-section">
      <button class="add-toggle" onclick="toggleForm('desayunos')">＋ Agregar desayuno</button>
      <div class="add-form" id="form-desayunos"></div>
    </div>
    <div class="grid" id="grid-desayunos"></div>
  </div>

  <!-- COMIDAS -->
  <div class="section" id="sec-comidas">
    <div class="section-header">
      <div class="section-icon" style="background:#E2F0E8">🍽️</div>
      <div class="section-title">Comidas</div>
      <div class="section-count" id="count-comidas"></div>
    </div>
    <div class="add-section">
      <button class="add-toggle" onclick="toggleForm('comidas')">＋ Agregar comida</button>
      <div class="add-form" id="form-comidas"></div>
    </div>
    <div class="grid" id="grid-comidas"></div>
  </div>

  <!-- CENAS -->
  <div class="section" id="sec-cenas">
    <div class="section-header">
      <div class="section-icon" style="background:#FAE8DC">🌙</div>
      <div class="section-title">Cenas</div>
      <div class="section-count" id="count-cenas"></div>
    </div>
    <div class="add-section">
      <button class="add-toggle" onclick="toggleForm('cenas')">＋ Agregar cena</button>
      <div class="add-form" id="form-cenas"></div>
    </div>
    <div class="grid" id="grid-cenas"></div>
  </div>

  <!-- COLACIONES -->
  <div class="section" id="sec-colaciones">
    <div class="section-header">
      <div class="section-icon" style="background:#EEE9F9">🎒</div>
      <div class="section-title">Colaciones</div>
      <div class="section-count" id="count-colaciones"></div>
    </div>
    <div class="add-section">
      <button class="add-toggle" onclick="toggleForm('colaciones')">＋ Agregar colación</button>
      <div class="add-form" id="form-colaciones"></div>
    </div>
    <div class="grid" id="grid-colaciones"></div>
  </div>

  <!-- TOTALES -->
  <div class="totales-section-wrap">
  <div class="section">
    <div class="section-header">
      <div class="section-icon" style="background:#E2F0E8">📊</div>
      <div class="section-title">Totales del día</div>
      <div class="section-count" id="selectedMealsText">Sin selecciones</div>
    </div>
    <div class="totales-grid">
      <div class="total-card" id="tc-kcal"><div class="total-val" id="tv-kcal">—</div><div class="total-lbl">kcal</div><div class="total-bar"><div class="total-fill" id="tf-kcal" style="width:0%"></div></div></div>
      <div class="total-card" id="tc-prot"><div class="total-val" id="tv-prot">—</div><div class="total-lbl">Proteína</div><div class="total-bar"><div class="total-fill" id="tf-prot" style="width:0%"></div></div></div>
      <div class="total-card" id="tc-carbs"><div class="total-val" id="tv-carbs">—</div><div class="total-lbl">Carbos</div><div class="total-bar"><div class="total-fill" id="tf-carbs" style="width:0%"></div></div></div>
      <div class="total-card" id="tc-fat"><div class="total-val" id="tv-fat">—</div><div class="total-lbl">Grasas</div><div class="total-bar"><div class="total-fill" id="tf-fat" style="width:0%"></div></div></div>
    </div>
  </div>
  </div>

</div>

<div class="footer" id="footer">
  Banco de Recetas
</div>

<!-- FLOATING SHOP PANEL -->
<div class="shop-panel" id="shopPanel">
  <div class="shop-panel-left">
    <div class="shop-icon-circle">🛒</div>
    <div>
      <div class="shop-panel-title">Lista de compras</div>
      <div class="shop-panel-sub">
        <span class="shop-count-pill" id="shopCount">0 recetas</span>
        <span class="shop-panel-subtext" id="shopSubtext"></span>
      </div>
    </div>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn-panel" id="shopClearAll">Vaciar</button>
    <a class="btn-panel btn-panel-cta" href="lista_compras.html">Ver lista →</a>
  </div>
</div>

<!-- MODAL: Crear producto nuevo -->
<div class="modal-overlay" id="newFoodModal"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="cloudStorage.js"></script>
<script src="auth.js"></script>
<script src="foods.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  // 1) Verifica sesión, redirige a login si no hay
  const user = await requireAuth();
  // 2) Carga todos los datos del usuario desde Supabase
  const ok = await initCloudStorage();
  if (!ok) { alert('No se pudieron cargar tus datos. Reintenta.'); return; }
  // 3) Refresca info del usuario con datos cloud (profile.role)
  await refreshSession();
  // 4) Inyecta top-bar (menú hamburguesa + carrito) y arranca la app
  mountTopBarAndDrawer({ showCart: true, cartCount: (shopListGet().recipes || []).length });
  initApp();
})();
</script>
</body>
</html>
