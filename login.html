<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Banco de Recetas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">🍳</div>
      <div>
        <div class="login-label">Banco de Recetas</div>
        <h1 class="login-title" id="loginTitle">Iniciar sesión</h1>
      </div>
    </div>

    <div class="login-help" id="loginHelp"></div>

    <form id="authForm" class="login-form" onsubmit="event.preventDefault();handleSubmit();">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <div class="form-group" id="usernameGroup" style="display:none">
        <label>Nombre (cómo te llamamos)</label>
        <input type="text" id="username" autocomplete="name">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <div class="form-group" id="password2Group" style="display:none">
        <label>Confirma la contraseña</label>
        <input type="password" id="password2" autocomplete="new-password">
      </div>

      <div class="login-error" id="errBox" style="display:none"></div>

      <button class="btn-submit login-submit" type="submit" id="submitBtn">Entrar</button>
    </form>

    <div class="login-toggle" id="toggleRow"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="cloudStorage.js"></script>
<script src="auth.js"></script>
<script>
let mode = 'login'; // 'login' | 'signup'

function setMode(m) {
  mode = m;
  const title = document.getElementById('loginTitle');
  const help = document.getElementById('loginHelp');
  const submit = document.getElementById('submitBtn');
  const p2group = document.getElementById('password2Group');
  const ugroup = document.getElementById('usernameGroup');
  const toggleRow = document.getElementById('toggleRow');
  const email = document.getElementById('email');
  const password = document.getElementById('password');

  document.getElementById('errBox').style.display = 'none';

  if (m === 'signup') {
    title.textContent = 'Crear cuenta';
    help.innerHTML = `Crea un usuario nuevo. Empezarás con un banco de recetas vacío.`;
    submit.textContent = 'Crear cuenta';
    p2group.style.display = '';
    ugroup.style.display = '';
    toggleRow.innerHTML = `¿Ya tienes cuenta? <a href="#" onclick="event.preventDefault();setMode('login')">Iniciar sesión</a>`;
    password.autocomplete = 'new-password';
  } else { // login
    title.textContent = 'Iniciar sesión';
    help.innerHTML = '';
    submit.textContent = 'Entrar';
    p2group.style.display = 'none';
    ugroup.style.display = 'none';
    toggleRow.innerHTML = `¿Eres nuevo? <a href="#" onclick="event.preventDefault();setMode('signup')">Crea una cuenta</a>`;
    password.autocomplete = 'current-password';
  }
  email.focus();
}

function showError(msg) {
  const box = document.getElementById('errBox');
  box.textContent = msg;
  box.style.display = '';
}

async function handleSubmit() {
  const email = document.getElementById('email').value.trim();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;

  try {
    if (mode === 'login') {
      await loginUser(email, password);
      location.replace('home.html');
      return;
    }
    if (mode === 'signup') {
      if (password !== password2) throw new Error('Las contraseñas no coinciden');
      await signupUser(email, password, username);
      // Intenta login automático. Si confirmación de email está activa, fallará.
      try {
        await loginUser(email, password);
        location.replace('home.html');
      } catch (e) {
        showError('Cuenta creada. Revisa tu email para confirmar antes de iniciar sesión.');
      }
      return;
    }
  } catch (e) {
    showError(e.message || 'Error desconocido');
  }
}

(async function init() {
  // Si ya hay sesión, salta directo a la app
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (user) {
    location.replace('home.html');
    return;
  }
  setMode('login');
})();
</script>
</body>
</html>
